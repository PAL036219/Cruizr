<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Matte Slate Tile Background -->
    <radialGradient id="appTileBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1A1C22" />
      <stop offset="55%" stop-color="#121418" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </radialGradient>

    <!-- Subtle Border Gleam -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
    </style>
  </defs>

  <!-- 1024x1024 Standard iOS / Android App Icon Rounded Canvas (scaled to 512) -->
  <rect width="512" height="512" rx="116" fill="url(#appTileBg)" />
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="url(#tileBorder)" stroke-width="2" />

  <!-- ================= MASTER TYPOGRAPHIC HERO ================= -->
  <g transform="translate(256, 230)">
    
    <!-- Scaled CRUIZR Wordmark centered at x=0, y=0 -->
    <g transform="translate(-205, -70) scale(0.58)">
      
      <!-- Letter 1: C (The Curve / The Route) -->
      <g transform="translate(10, 0)">
        <path
          d="M 85,25 C 32,25 -2,58 -2,108 C -2,158 32,190 85,190"
          stroke="#EDE8E1"
          stroke-width="22"
          stroke-linecap="round"
        />
        <circle cx="85" cy="25" r="9.5" fill="#E06D3B" />
      </g>

      <!-- Letter 2: R (The Rider Forward Stride) -->
      <g transform="translate(135, 0)">
        <line x1="0" y1="25" x2="0" y2="190" stroke="#EDE8E1" stroke-width="22" stroke-linecap="round" />
        <path
          d="M 0,25 C 65,25 80,56 62,92 C 44,116 0,110 0,110"
          stroke="#EDE8E1"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <line x1="22" y1="106" x2="68" y2="190" stroke="#E06D3B" stroke-width="22" stroke-linecap="round" />
      </g>

      <!-- Letter 3: U (Unity Duo-Channel Bridge) -->
      <g transform="translate(265, 0)">
        <path
          d="M 0,25 L 0,118 C 0,190 85,190 85,118 L 85,25"
          stroke="#EDE8E1"
          stroke-width="22"
          stroke-linecap="round"
        />
        <line x1="0" y1="88" x2="85" y2="88" stroke="#88A698" stroke-width="9" stroke-linecap="round" />
      </g>

      <!-- Letter 4: I (Bike Headlight & Fork) -->
      <g transform="translate(400, 0)">
        <!-- Headlight Bezel & Amber Bulb -->
        <circle cx="0" cy="8" r="17" fill="#181A1D" stroke="#EDE8E1" stroke-width="5" />
        <circle cx="0" cy="8" r="10.5" fill="#E06D3B" />
        <line x1="-5" y1="8" x2="5" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

        <!-- Fork Stem -->
        <line x1="0" y1="36" x2="0" y2="190" stroke="#EDE8E1" stroke-width="22" stroke-linecap="round" />
      </g>

      <!-- Letter 5: Z (Mountain Switchback) -->
      <g transform="translate(485, 0)">
        <line x1="-8" y1="25" x2="68" y2="25" stroke="#EDE8E1" stroke-width="22" stroke-linecap="round" />
        <line x1="62" y1="32" x2="-2" y2="183" stroke="#E06D3B" stroke-width="22" stroke-linecap="round" />
        <line x1="-8" y1="190" x2="68" y2="190" stroke="#EDE8E1" stroke-width="22" stroke-linecap="round" />
      </g>

      <!-- Letter 6: R (Open Horizon Leg) -->
      <g transform="translate(615, 0)">
        <line x1="0" y1="25" x2="0" y2="190" stroke="#EDE8E1" stroke-width="22" stroke-linecap="round" />
        <path
          d="M 0,25 C 65,25 80,56 62,92 C 44,116 0,110 0,110"
          stroke="#EDE8E1"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M 22,106 L 56,176 L 80,176"
          stroke="#88A698"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </g>
    </g>

    <!-- ================= TAGLINE LOCKUP ================= -->
    <text
      x="0"
      y="95"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
      font-size="16"
      font-weight="800"
      letter-spacing="10"
      fill="#EDE8E1"
    >NEVER CRUISE ALONE</text>

    <!-- Conceptual Sub-Pillars -->
    <text
      x="0"
      y="122"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
      font-size="8.5"
      font-weight="600"
      letter-spacing="3.5"
      fill="#88A698"
    >curve • rider • unity • pin • switchback • horizon</text>

  </g>
</svg>
